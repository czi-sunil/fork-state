# @package _global_
#
# config for SCG-LLM on `state`
#

defaults:
  - override /data: perturbation
  - override /model: state

# Top level parameters

log_level: "INFO"     # One of: NOTSET, DEBUG, INFO, WARNING, ERROR, CRITICAL
datadir: ???          # Required. Dir where all input data files are. Used below.

# Sub-level params

data:
  kwargs:
    # Override as: data.kwargs.PARAM=VAL
    num_workers: 12
    # About the data file ... defaults for `parse1m` ...
    batch_col: "donor"                          # col-name for the batch label
    pert_col: "cytokine"                        # col-name for the Perturbation label
    cell_type_key: "cell_type"                  # col-name for the Cell-Type
    control_pert: "PBS"                         # Perturbation label value for Control Cells
    embed_key: "X_hvg"                          # Tell ST to use HVGs, from `adata.obsm["X_hvg"]`
    output_space: "gene"                        # ST model, predicting gene expression.
    # Data files
    toml_config_path: "${datadir}/cell-load.toml"  # Describes the data
    # Genetic perturbation features, based on tergeted gene,  from ESM2
    # perturbation_features_file: "${datadir}/ESM2_pert_features.pt"    # torch dict: targeted gene -> embedding vector

# Override params of model to be closer to params for Parse-PBMC 10M cells in ARC paper
model:
  kwargs:
    hidden_dim: 720       # ARC paper uses 1440
    n_encoder_layers: 4
    n_decoder_layers: 4
    cell_set_len: 256     # ARC paper uses 512
    batch_encoder: True
    # gene_encoder is used in `state.tx.models.base.PerturbationModel` for State-Emb model.
    gene_decoder_bool: False      # Default is True. Override for State-Tx.

# Training defaults
training:
  batch_size: 64
  lr: 1e-3
